<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - Open Azitfh</title>
  <script>if(localStorage.getItem("jnaver_theme")!=="light")document.documentElement.setAttribute("data-theme","dark");</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">Open <span>Azitfh</span></a>
    <nav>
      <a href="index.html">홈</a>
      <a href="login.html">로그인</a>
      <a href="signup.html" class="active">회원가입</a>
      <button id="themeToggle" class="theme-toggle">🌙</button>
    </nav>
  </header>

  <div class="auth-wrap">
    <div class="auth-box">
      <h2>🌟 회원가입</h2>

      <form id="signupForm" novalidate>

        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email"
                 placeholder="example@email.com" autocomplete="email">
          <div class="error-msg" id="err-email"></div>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password"
                 placeholder="8자 이상 입력해 주세요" autocomplete="new-password">
          <div class="error-msg" id="err-pw"></div>
        </div>

        <div class="field">
          <label for="passwordCheck">비밀번호 확인</label>
          <input type="password" id="passwordCheck" name="passwordCheck"
                 placeholder="비밀번호를 한 번 더 입력해 주세요" autocomplete="new-password">
          <div class="error-msg" id="err-pwcheck"></div>
        </div>

        <div class="field">
          <label for="nickname">닉네임</label>
          <input type="text" id="nickname" name="nickname"
                 placeholder="친구들에게 보여질 이름 (2~10자)" maxlength="10">
          <div class="error-msg" id="err-nickname"></div>
        </div>

        <div class="global-error" id="err-global"></div>

        <button type="submit" class="btn btn-primary btn-full">가입하기 🎉</button>
      </form>

      <div class="auth-footer">
        이미 회원이신가요? <a href="login.html">로그인</a>
      </div>
    </div>

    <!-- 이메일 인증 안내 (가입 성공 후 표시) -->
    <div class="auth-box hidden" id="emailSentBox">
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:48px;margin-bottom:12px">📬</div>
        <h2>인증 이메일을 보냈어요!</h2>
        <p id="emailSentAddr" style="color:var(--primary);font-weight:600;margin:8px 0"></p>
        <p style="color:var(--text-light);font-size:14px;line-height:1.6;margin:12px 0 20px">
          위 이메일 주소로 인증 링크를 보냈습니다.<br>
          메일함을 확인하고 링크를 클릭하면 가입이 완료됩니다.<br>
          <span style="font-size:12px">(스팸함도 확인해 주세요)</span>
        </p>
        <button type="button" id="resendBtn" class="btn btn-secondary btn-full" style="margin-bottom:10px">인증 이메일 다시 보내기</button>
        <a href="login.html" class="btn btn-primary btn-full" style="display:block;text-align:center;text-decoration:none">로그인 페이지로 이동</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="utils.js"></script>
  <script src="app.js"></script>
  <script>initDarkMode(); initSignup();</script>
</body>
</html>
